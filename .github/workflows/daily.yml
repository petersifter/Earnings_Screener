name: Daily Earnings Screener
on:
  schedule:
    - cron: '0 14 * * 0'
    - cron: '0 23 * * 1-4'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pip list | grep -Ei "yfinance|pandas|curl|finance-calendars"

      # The screener writes reports/<name>.txt itself and drops .last_run with
      # KEY=value lines. No shell date arithmetic, so a run crossing midnight
      # UTC can no longer misname the attachment. Exits 1 if the data source
      # failed, rather than emitting an empty list that reads like a result.
      - name: Self-test
        run: python selftest.py

      - name: Run screener
        env:
          SCREENER_SPACING: '0.5'
        run: |
          set -o pipefail
          python earnings_screener.py --tomorrow

      # always() so the failure email can still attach the diagnosis.
      - name: Load report metadata
        if: always()
        run: |
          if [ -f .last_run ]; then
            cat .last_run >> $GITHUB_ENV
            cat .last_run
          else
            echo "::warning::no .last_run written"
          fi

      - name: Save report
        if: always()
        run: |
          if [ -n "$(git status --porcelain reports/)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add reports/
            git commit -m "Daily ${{ env.REPORT_NAME }}"
            git pull --rebase
            git push
          else
            echo "nothing to commit"
          fi

      - name: Email report
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Earnings Screener
          to: ${{ secrets.MAIL_TO }}
          subject: "Daily Screener — ${{ env.SESSION }}"
          body: |
            ${{ env.HEADLINE }}

            Session: ${{ env.SESSION }}
            Attached: ${{ env.REPORT_NAME }}

            View on GitHub:
            https://github.com/petersifter/Earnings_Screener/tree/main/reports
          attachments: ${{ env.REPORT_FILE }}

      # Fires when the run broke or the data source failed. Silence and an
      # empty list are no longer indistinguishable.
      - name: Email failure notice
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Earnings Screener
          to: ${{ secrets.MAIL_TO }}
          subject: "Daily Screener FAILED — ${{ env.SESSION }}"
          body: |
            The daily screener did not produce a usable result.

            ${{ env.HEADLINE }}

            If this says DATA FAILURE, the report is attached and its
            SCREENING NOTES section shows the failure rate and the exact
            yfinance version the runner installed. Compare that against
            your local venv:  pip show yfinance

            Logs:
            https://github.com/petersifter/Earnings_Screener/actions/runs/${{ github.run_id }}
          attachments: ${{ env.REPORT_FILE }}
          ignore_unmatched: true
