name: Daily Earnings Screener
on:
  schedule:
    - cron: '0 14 * * 0'
    - cron: '0 23 * * 1-4'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      # The screener writes reports/<name>.txt itself and drops a .last_run
      # file of KEY=value lines. No shell date arithmetic anywhere, so a run
      # that crosses midnight UTC can no longer misname the attachment.
      - name: Run screener
        run: |
          set -o pipefail
          echo "1" | python earnings_screener.py

      - name: Load report metadata
        run: |
          if [ ! -f .last_run ]; then
            echo "::error::Screener finished without writing .last_run"
            exit 1
          fi
          cat .last_run >> $GITHUB_ENV
          cat .last_run

      - name: Verify report exists
        run: |
          if [ ! -s "${{ env.REPORT_FILE }}" ]; then
            echo "::error::Report file missing or empty: ${{ env.REPORT_FILE }}"
            ls -la reports/ || true
            exit 1
          fi

      - name: Save report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/
          git commit -m "Daily ${{ env.REPORT_NAME }}" || echo "nothing to commit"
          git push

      - name: Email report
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Earnings Screener
          to: ${{ secrets.MAIL_TO }}
          subject: "Daily Screener — ${{ env.SESSION }}"
          body: |
            ${{ env.HEADLINE }}

            Session: ${{ env.SESSION }}
            Attached: ${{ env.REPORT_NAME }}

            View on GitHub:
            https://github.com/petersifter/Earnings_Screener/tree/main/reports
          attachments: ${{ env.REPORT_FILE }}

      # Fires only if something above broke, so silence never looks like
      # "no stocks qualified" again.
      - name: Email failure notice
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Earnings Screener
          to: ${{ secrets.MAIL_TO }}
          subject: "Daily Screener FAILED"
          body: |
            The daily screener run did not complete.

            Logs:
            https://github.com/petersifter/Earnings_Screener/actions/runs/${{ github.run_id }}
