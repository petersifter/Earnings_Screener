name: Weekly Earnings Screener
on:
  schedule:
    - cron: '0 23 * * 5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run screener
        run: |
          mkdir -p reports
          echo "2" | python weekly_screener.py 2>&1 | tee reports/weekly_$(date +%Y-%m-%d).txt
      - name: Save report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/
          git commit -m "Weekly $(date +%Y-%m-%d)" || echo "nothing to commit"
          git push
      - name: Email report
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Earnings Screener
          to: ${{ secrets.MAIL_TO }}
          subject: "Weekly Earnings Screener — $(date +%Y-%m-%d)"
          body: |
            Weekly earnings screener report attached.

            Generated: $(date)

            Open the attached file or view on GitHub:
            https://github.com/petersifter/Earnings_Screener/tree/main/reports
          attachments: reports/weekly_$(date +%Y-%m-%d).txt