name: Weekly Earnings Screener
on:
  schedule:
    - cron: '0 23 * * 5'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      # This run regularly takes over an hour and crosses midnight UTC, which
      # is exactly what used to break the attachment: the file was named with
      # Friday's date and the email looked for Saturday's. Python owns the
      # filename now.
      - name: Run screener
        run: |
          set -o pipefail
          echo "2" | python weekly_screener.py

      - name: Load report metadata
        run: |
          if [ ! -f .last_run ]; then
            echo "::error::Screener finished without writing .last_run"
            exit 1
          fi
          cat .last_run >> $GITHUB_ENV
          cat .last_run

      - name: Verify report exists
        run: |
          if [ ! -s "${{ env.REPORT_FILE }}" ]; then
            echo "::error::Report file missing or empty: ${{ env.REPORT_FILE }}"
            ls -la reports/ || true
            exit 1
          fi

      - name: Save report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/
          git commit -m "Weekly ${{ env.REPORT_NAME }}" || echo "nothing to commit"
          git push

      - name: Email report
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Earnings Screener
          to: ${{ secrets.MAIL_TO }}
          subject: "Weekly Screener — ${{ env.SESSION }}"
          body: |
            ${{ env.HEADLINE }}

            Coverage: ${{ env.SESSION }}
            Attached: ${{ env.REPORT_NAME }}

            View on GitHub:
            https://github.com/petersifter/Earnings_Screener/tree/main/reports
          attachments: ${{ env.REPORT_FILE }}

      - name: Email failure notice
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Earnings Screener
          to: ${{ secrets.MAIL_TO }}
          subject: "Weekly Screener FAILED"
          body: |
            The weekly screener run did not complete.

            Logs:
            https://github.com/petersifter/Earnings_Screener/actions/runs/${{ github.run_id }}
